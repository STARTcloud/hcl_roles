---
name: Release Please

"on":
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  molecule:
    name: Molecule
    # The push that merges a release PR changes only version + changelog —
    # molecule proves nothing there. Lint still gates that push, and the
    # release-please job below explicitly tolerates the skip.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    uses: ./.github/workflows/molecule.yml

  release-please:
    name: Release Please
    needs: [lint, molecule]
    # molecule is skipped on release-merge pushes; without this result check a
    # skipped need would silently skip this job too and no release would cut.
    if: >-
      ${{ !cancelled() && needs.lint.result == 'success' &&
          contains(fromJSON('["success", "skipped"]'), needs.molecule.result) }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      full_version: ${{ steps.compose.outputs.version }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7

      # No release-type input here: setting it makes the action ignore the
      # config/manifest files entirely. The release type lives in
      # release-please-config.json.
      #
      # App token, not GITHUB_TOKEN: PRs created with GITHUB_TOKEN never fire
      # pull_request workflows (GitHub recursion guard) — release PRs sat with
      # checks stuck on "Expected" until run by hand. With the App token the
      # release PR runs CI on its own; molecule.yml skips its matrix on
      # release-please-- branches so that CI is lint-cheap.
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Compose full version
        id: compose
        # Explicit string comparison — release_created is the string "false"
        # (not empty) on the push that follows a release PR merge.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          MAJOR='${{ steps.release.outputs.major }}'
          MINOR='${{ steps.release.outputs.minor }}'
          PATCH='${{ steps.release.outputs.patch }}'
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

  build-collection:
    name: Build & Upload Collection Artifact
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ansible-core
        run: pip install ansible-core

      # Contract inherited from the provisioner-catalog publisher kit:
      # version source of truth is galaxy.yml — refuse on mismatch; ship the
      # immutable versioned archive, a mutable "latest" alias, and a .sha256
      # sidecar for every asset.
      - name: Build collection artifact
        id: build
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*)"?.*/\1/p' galaxy.yml | head -n1)"
          echo "Parsed galaxy.yml version=$VERSION"
          if [ "$VERSION" != "${{ needs.release-please.outputs.full_version }}" ]; then
            echo "galaxy.yml version ($VERSION) does not match released version (${{ needs.release-please.outputs.full_version }})" >&2
            exit 1
          fi
          ansible-galaxy collection build
          ARTIFACT="startcloud-hcl_roles-$VERSION.tar.gz"
          cp "$ARTIFACT" startcloud-hcl_roles.tar.gz
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          sha256sum startcloud-hcl_roles.tar.gz > startcloud-hcl_roles.tar.gz.sha256
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.artifact }}.sha256" \
            startcloud-hcl_roles.tar.gz \
            startcloud-hcl_roles.tar.gz.sha256 --clobber

  # Announces the published release to the provisioners that vendor this
  # collection. The consumer's dependency-bump.yml (repository_dispatch:
  # dependency-update) pins itself to the tag and opens its own bump PR —
  # all bump logic lives consumer-side; this job only notifies.
  #
  # needs build-collection: the dispatch must never fire before the collection
  # artifacts are uploaded, or the consumer's dev-release build would race a
  # half-published release.
  #
  # App token, not GITHUB_TOKEN: dispatches sent with GITHUB_TOKEN cannot
  # cross repos. The startcloud-bot App (org secrets BOT_APP_ID /
  # BOT_PRIVATE_KEY) is installed on this repo and every consumer.
  notify-consumers:
    name: Notify consumers
    needs: [release-please, build-collection]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - STARTcloud/hcl_domino_standalone_provisioner
          - STARTcloud/hcl_domino_additional_provisioner
          - Moonshine-IDE/moonshinedev_provisioner_private
    steps:
      - name: Split owner and repo
        id: target
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          echo "owner=${CONSUMER%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${CONSUMER##*/}" >> "$GITHUB_OUTPUT"

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}

      - name: Dispatch dependency-update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CONSUMER: ${{ matrix.consumer }}
        run: |
          SHA="$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)"
          gh api "repos/$CONSUMER/dispatches" \
            -f event_type=dependency-update \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[sha]=$SHA"
          echo "Dispatched dependency-update: $CONSUMER <- $TAG"
