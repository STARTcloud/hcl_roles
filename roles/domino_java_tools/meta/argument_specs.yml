---
argument_specs:
  main:
    short_description: Build the Domino Java tools
    description:
      - Builds and installs the Java-based Domino management utilities.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help output during the run.
      build_utility_jars:
        type: bool
        default: true
        description: Build the utility jars from source.
