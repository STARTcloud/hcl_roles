---
argument_specs:
  main:
    short_description: Install Traveler for Microsoft Outlook
    description:
      - Installs HCL Traveler for Microsoft Outlook on top of Traveler.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      show_help:
        type: bool
        default: true
        description: Whether to display help output during the run.
