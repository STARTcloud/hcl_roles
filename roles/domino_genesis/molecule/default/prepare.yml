---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: "Creating the startcloud group (normally created by the users role)"
      ansible.builtin.group:
        name: startcloud
        state: present

    - name: "Creating the startcloud user (normally created by the users role)"
      ansible.builtin.user:
        name: startcloud
        group: startcloud
        home: /home/startcloud
        shell: /bin/bash
        create_home: true
        state: present

    - name: "Creating the Domino data and completed directories a provisioned guest carries"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /local/notesdata/IBM_TECHNICAL_SUPPORT
        - /vagrant/completed

    - name: "Seeding the console log line a started Domino HTTP task writes"
      ansible.builtin.copy:
        dest: /local/notesdata/IBM_TECHNICAL_SUPPORT/console.log
        content: "HTTP Server: Started\n"
        mode: "0644"

    - name: "Installing a domino unit for the role to stop and start"
      ansible.builtin.copy:
        dest: /etc/systemd/system/domino.service
        content: |
          [Unit]
          Description=Domino stand-in

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: "Starting and enabling the domino unit"
      ansible.builtin.systemd:
        name: domino
        state: started
        enabled: true
        daemon_reload: true
