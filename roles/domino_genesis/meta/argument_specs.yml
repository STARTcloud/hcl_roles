---
argument_specs:
  main:
    short_description: Install Genesis
    description:
      - Installs the Genesis Java addin that deploys Domino applications from JSON instructions.
    author: Mark Gilbert
    options:
      run_tasks:
        type: bool
        default: true
        description: Master gate — when false the role loads its vars but runs no tasks.
      genesis_debug:
        type: bool
        default: false
        description: Print Genesis output during the run.
      genesis_version:
        type: str
        default: 0.6.20
        description: Release of Genesis to install.
      genesis_jar:
        type: str
        default: Genesis-0.6.20.jar
        description: File name of the Genesis jar.
