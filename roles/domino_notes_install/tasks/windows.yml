---
- name: "Creating Notes installation directories"
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ notes_temp_dir }}"
    - "{{ notes_unpack_dir }}"
    - "{{ notes_install_dir }}"

- name: "Installing softperfect-ramdisk"
  when: notes_use_ramdisk
  chocolatey.chocolatey.win_chocolatey:
    name: "softperfect-ramdisk"
    state: present

- name: "Checking if Notes is already installed"
  register: notes_installed
  ansible.windows.win_stat:
    path: "{{ notes_exe_path }}"

# -
#  name: "Removing existing Notes installation (always replace)"
#  ansible.windows.win_command:
#    cmd: "{{ notes_install_dir }}\\uninstall.exe /S"
#  when: notes_installed.stat.exists
#  ignore_errors: true
#
# Phase C: Installer Download Management
- name: "Checking if Notes installer exists"
  register: notes_installer_check
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_installer_exe }}"

- name: "Downloading Notes installer using Bearer token from {{ installer_base_url }}"
  register: notes_installer_bearer
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_installer_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_installer_exe }}"
    headers:
      Authorization: "Bearer {{ installer_url_bearer }}"
    validate_certs: false
  when:
    - not notes_installer_check.stat.exists
    - installer_url_bearer is defined
    - installer_url_bearer != ''
  failed_when: false

- name: "Re-checking the Notes installer after the Bearer download"
  register: notes_installer_post_bearer
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_installer_exe }}"

- name: "Downloading Notes installer using basic auth from {{ installer_base_url }}"
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_installer_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_installer_exe }}"
    url_username: "{{ installer_url_user }}"
    url_password: "{{ installer_url_pass }}"
    validate_certs: false
  when:
    - not notes_installer_post_bearer.stat.exists

- name: "Checking if Notes fixpack installer exists"
  register: notes_fixpack_check
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_fixpack_exe }}"
  when: notes_installer_fixpack_install and notes_fixpack_exe != ""

- name: "Downloading Notes fixpack using Bearer token from {{ installer_base_url }}"
  register: notes_fixpack_bearer
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_fixpack_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_fixpack_exe }}"
    headers:
      Authorization: "Bearer {{ installer_url_bearer }}"
    validate_certs: false
  when:
    - notes_installer_fixpack_install
    - notes_fixpack_exe != ""
    - not notes_fixpack_check.stat.exists
    - installer_url_bearer is defined
    - installer_url_bearer != ''
  failed_when: false

- name: "Re-checking the Notes fixpack after the Bearer download"
  register: notes_fixpack_post_bearer
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_fixpack_exe }}"
  when: notes_installer_fixpack_install and notes_fixpack_exe != ""

- name: "Downloading Notes fixpack using basic auth from {{ installer_base_url }}"
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_fixpack_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_fixpack_exe }}"
    url_username: "{{ installer_url_user }}"
    url_password: "{{ installer_url_pass }}"
    validate_certs: false
  when:
    - notes_installer_fixpack_install
    - notes_fixpack_exe != ""
    - not notes_fixpack_post_bearer.stat.exists

- name: "Checking if Notes hotfix installer exists"
  register: notes_hotfix_check
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_hotfix_exe }}"
  when: notes_installer_hotfix_install and notes_hotfix_exe != ""

- name: "Downloading Notes hotfix using Bearer token from {{ installer_base_url }}"
  register: notes_hotfix_bearer
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_hotfix_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_hotfix_exe }}"
    headers:
      Authorization: "Bearer {{ installer_url_bearer }}"
    validate_certs: false
  when:
    - notes_installer_hotfix_install
    - notes_hotfix_exe != ""
    - not notes_hotfix_check.stat.exists
    - installer_url_bearer is defined
    - installer_url_bearer != ''
  failed_when: false

- name: "Re-checking the Notes hotfix after the Bearer download"
  register: notes_hotfix_post_bearer
  ansible.windows.win_stat:
    path: "{{ notes_temp_dir }}\\{{ notes_hotfix_exe }}"
  when: notes_installer_hotfix_install and notes_hotfix_exe != ""

- name: "Downloading Notes hotfix using basic auth from {{ installer_base_url }}"
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/Notes/{{ notes_hotfix_exe }}"
    dest: "{{ notes_temp_dir }}\\{{ notes_hotfix_exe }}"
    url_username: "{{ installer_url_user }}"
    url_password: "{{ installer_url_pass }}"
    validate_certs: false
  when:
    - notes_installer_hotfix_install
    - notes_hotfix_exe != ""
    - not notes_hotfix_post_bearer.stat.exists

- name: "Unpacking Notes installer using 7zip"
  ansible.windows.win_command:
    cmd: "7z x {{ notes_installer_exe }} -o{{ notes_unpack_dir }} -y"
    chdir: "{{ notes_temp_dir }}"
  register: notes_unpack_result

- name: "Copying MST transform file to unpacked directory"
  ansible.windows.win_copy:
    src: "{{ notes_mst_file }}"
    dest: "{{ notes_unpack_dir }}\\{{ notes_mst_file }}"

- name: "Creating temporary Multi User Data Dir drive"
  when: notes_multiuser_enabled
  ansible.windows.win_command:
    argv:
      - "C:\\Program Files\\SoftPerfect RAM Disk\\ramdiskctl.exe"
      - create
      - --size
      - "{{ notes_ramdisk_size }}"
      - --fs
      - "{{ notes_ramdisk_filesystem | lower }}"
      - --letter
      - "{{ notes_multiuser_base_dir }}"
      - --volume-label
      - "{{ notes_ramdisk_label }}"
  register: tempdisk_create_result

- name: "Installing Notes with multi-user configuration and MST transform"
  when:
    - notes_multiuser_enabled
    - notes_include_transform
  ansible.windows.win_command:
    cmd: "setup.exe /s /v\"SETMULTIUSER=1 CITRIX=1 MULTIUSERBASEDIR={{ notes_multiuser_base_dir }}:\\ /L*v C:\\temp\\verbose.log MULTIUSERCOMMONDIR={{ notes_multiuser_common_dir }}\\ /qb+\""
    chdir: "{{ notes_unpack_dir }}"
  register: notes_install_result

- name: "Installing Notes with multi-user configuration"
  when:
    - notes_multiuser_enabled
    - not notes_include_transform
  ansible.windows.win_command:
    cmd: "setup.exe /s /v\"SETMULTIUSER=1 CITRIX=1 MULTIUSERBASEDIR={{ notes_multiuser_base_dir }}:\\ /L*v C:\\temp\\verbose.log MULTIUSERCOMMONDIR={{ notes_multiuser_common_dir }}\\ /qb+\""
    chdir: "{{ notes_unpack_dir }}"
  register: notes_install_result

# Panagenda/Doug method: plain single-user install to default locations; per-user
# separation comes from the Data junction onto the RAM disk plus MarvelClient roaming.
- name: "Installing Notes (single-user, default locations)"
  when: not notes_multiuser_enabled
  ansible.windows.win_command:
    cmd: "setup.exe /s /v\"/L*v C:\\temp\\verbose.log /qb+\""
    chdir: "{{ notes_unpack_dir }}"
  register: notes_install_result

- name: "Installing Notes fixpack"
  ansible.windows.win_command:
    cmd: "{{ notes_fixpack_exe }} /s /v\"/qb+\""
    chdir: "{{ notes_temp_dir }}"
  when: notes_installer_fixpack_install and notes_fixpack_exe != ""
  register: notes_fixpack_result

- name: "Installing Notes hotfix"
  ansible.windows.win_command:
    cmd: "{{ notes_hotfix_exe }} /s /v\"/qb+\""
    chdir: "{{ notes_temp_dir }}"
  when: notes_installer_hotfix_install and notes_hotfix_exe != ""
  register: notes_hotfix_result

- name: "Waiting for softperfect Ram Disk to be configured"
  ansible.windows.win_wait_for:
    path: C:\temp\softperfect_uninstalled
    timeout: "{{ windows_update_reboot_timeout | default(7200) }}"

# -
#  name: "Removing softperfect-ramdisk"
#  when: notes_use_ramdisk
#  chocolatey.chocolatey.win_chocolatey:
#    name: "softperfect-ramdisk"
#    state: absent

- name: "Rebooting to Softperfect Drivers are removed"
  ansible.windows.win_reboot:
    reboot_timeout: "{{ windows_update_reboot_timeout | default(7200) }}"

- name: "Waiting for softperfect Ram Disk to be configured"
  ansible.windows.win_wait_for:
    path: C:\temp\softperfect_installed
    timeout: "{{ windows_update_reboot_timeout | default(7200) }}"

# -
#  name: "Deleting temporary RAM disk"
#  when: notes_multiuser_enabled
#  ansible.windows.win_command:
#    cmd: "\"C:\\Program Files\\SoftPerfect RAM Disk\\ramdiskc.exe\" /del:{{ notes_multiuser_base_dir }} /force"
#  register: ramdisk_delete_result

# Persistent startup RAM disk: the SPVVEngine boot-start driver mounts every disk
# defined under Options\Auto\<letter>: before any user logs in. Survives sysprep
# (SYSTEM hive is preserved). Replaces the deprecated ramdisk.exe /add: CLI, which
# no longer writes the saved configuration in current SoftPerfect releases.
- name: "Defining persistent startup Ram Disk in SPVVEngine driver registry"
  when: notes_use_ramdisk
  ansible.windows.win_powershell:
    script: |
      $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\SPVVEngine\Options\Auto\{{ notes_ramdisk_path }}:'
      New-Item -Path $key -Force | Out-Null
      New-ItemProperty -Path $key -Name MountFlags -PropertyType DWord -Value {{ notes_ramdisk_mount_flags }} -Force | Out-Null
      New-ItemProperty -Path $key -Name NumaNodeIndex -PropertyType DWord -Value 0 -Force | Out-Null
      New-ItemProperty -Path $key -Name Properties -PropertyType DWord -Value 0 -Force | Out-Null
      New-ItemProperty -Path $key -Name FileSystem -PropertyType DWord -Value {{ notes_ramdisk_filesystem_code }} -Force | Out-Null
      New-ItemProperty -Path $key -Name AutoflushFlags -PropertyType DWord -Value 0 -Force | Out-Null
      New-ItemProperty -Path $key -Name AutoflushPeriod -PropertyType DWord -Value 0 -Force | Out-Null
      New-ItemProperty -Path $key -Name VolumeSize -PropertyType QWord -Value ({{ notes_ramdisk_size_mb }} * 1MB) -Force | Out-Null
      $label = [System.Text.Encoding]::ASCII.GetBytes('{{ notes_ramdisk_label }}')
      New-ItemProperty -Path $key -Name VolumeLabel -PropertyType Binary -Value $label -Force | Out-Null
      # uint16 byte-length prefix followed by the path in UTF-16LE
      $folders = '{{ notes_ramdisk_initial_folders }}'
      $bytes = [System.BitConverter]::GetBytes([uint16]($folders.Length * 2)) + [System.Text.Encoding]::Unicode.GetBytes($folders)
      New-ItemProperty -Path $key -Name InitialFolders -PropertyType Binary -Value $bytes -Force | Out-Null
  register: ramdisk_create_result

- name: "Verifying Notes installation"
  ansible.windows.win_stat:
    path: "{{ notes_exe_path }}"
  register: notes_verification

- name: "Notes installation verification failed"
  ansible.builtin.fail:
    msg: "Notes installation failed - notes.exe not found at {{ notes_exe_path }}"
  when: not notes_verification.stat.exists

# Single-user + RAM disk: stash the installer's Data folder, junction Data onto the
# RAM disk (SPVVEngine InitialFolders recreates the target tree every boot), and drop
# a common-Startup-folder script that repopulates the stub data at each user login.
- name: "Configuring Notes Data junction onto RAM disk"
  when:
    - not notes_multiuser_enabled
    - notes_use_ramdisk
  block:
    - name: "Checking if installer Data folder was already relocated"
      register: notes_data_orig_check
      ansible.windows.win_stat:
        path: "{{ notes_install_dir }}\\Data_orig"

    - name: "Relocating installer Data folder to Data_orig"
      when: not notes_data_orig_check.stat.exists
      ansible.windows.win_powershell:
        script: |
          Move-Item -LiteralPath '{{ notes_install_dir }}\Data' -Destination '{{ notes_install_dir }}\Data_orig'

    - name: "Checking if Data junction exists"
      register: notes_data_junction_check
      ansible.windows.win_stat:
        path: "{{ notes_install_dir }}\\Data"

    - name: "Creating Data junction to RAM disk"
      when: not notes_data_junction_check.stat.exists
      ansible.windows.win_command:
        cmd: "cmd.exe /c mklink /J \"{{ notes_install_dir }}\\Data\" \"{{ notes_ramdisk_path }}:\\HCL\\Notes\\Data\""

    - name: "Installing Startup folder script to populate RAM disk Notes data at login"
      ansible.windows.win_copy:
        dest: "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\StartUp\\notes_ramdisk_data.bat"
        content: |
          @echo off
          xcopy "{{ notes_install_dir }}\Data_orig" "{{ notes_ramdisk_path }}:\HCL\Notes\Data\" /E /I /Y

- name: "Cleaning up unpacked installer files"
  ansible.windows.win_file:
    path: "{{ notes_unpack_dir }}"
    state: absent
  when: notes_cleanup_temp_files

- name: "Cleaning up downloaded installer files"
  ansible.windows.win_file:
    path: "{{ notes_temp_dir }}"
    state: absent
  when: notes_cleanup_temp_files and not notes_keep_installers

- name: "Notes installation completed successfully"
  ansible.builtin.debug:
    msg: "HCL Notes {{ notes_major_version }}.{{ notes_minor_version }}.{{ notes_patch_version }} {{ notes_fixpack_version }} installed successfully"

- name: "Checking if Marvel Client DLL exists"
  when: notes_enable_marvel_client
  register: notes_marvel_client_dll
  ansible.windows.win_stat:
    path: "{{ notes_install_dir }}\\{{ marvel_client_dll }}"

- name: "Downloading Marvel Client using Bearer token from {{ installer_base_url }}"
  register: marvel_client_bearer
  when:
    - notes_enable_marvel_client
    - installer_url_bearer is defined
    - installer_url_bearer != ''
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/MarvelClient/{{ marvel_client_dll_artifact }}"
    dest: "{{ notes_install_dir }}\\{{ marvel_client_dll }}"
    headers:
      Authorization: "Bearer {{ installer_url_bearer }}"
    validate_certs: false
  failed_when: false

- name: "Re-checking the Marvel Client DLL after the Bearer download"
  register: marvel_client_post_bearer
  ansible.windows.win_stat:
    path: "{{ notes_install_dir }}\\{{ marvel_client_dll }}"
  when: notes_enable_marvel_client

- name: "Downloading Marvel Client using basic auth from {{ installer_base_url }}"
  when:
    - notes_enable_marvel_client
    - not marvel_client_post_bearer.stat.exists
  ansible.windows.win_get_url:
    url: "{{ installer_base_url }}/{{ installer_url_app_path }}/MarvelClient/{{ marvel_client_dll_artifact }}"
    dest: "{{ notes_install_dir }}\\{{ marvel_client_dll }}"
    url_username: "{{ installer_url_user }}"
    url_password: "{{ installer_url_pass }}"
    validate_certs: false

# Single-user stub notes.ini in the program dir (Panagenda/Doug method). Written to
# notes.ini for use and stubnotes.ini as the pristine copy for any future restore.
# Must never be mutated by launching Notes on the template image.
- name: "Configuring stub notes.ini for Marvel Client (single-user)"
  when:
    - not notes_multiuser_enabled
    - notes_enable_marvel_client
  ansible.windows.win_copy:
    dest: "{{ notes_install_dir }}\\{{ item }}"
    content: |
      [Notes]
      KitType=1
      InstallType={{ notes_install_type }}
      InstallMode=1
      NotesProgram={{ notes_install_dir }}\
      Directory={{ notes_install_dir }}\Data
      EXTMGR_ADDINS={{ marvel_client_dll }}
      MC_NetworkDirectory={{ notes_marvel_client_network_directory }}
      MC_AllowSyncDuringSetup={{ notes_marvel_client_allow_sync_during_setup }}
      MC_AllowSyncDuringSetup_FixPrompt={{ notes_marvel_client_allow_sync_during_setup_fixprompt }}
      MC_DB={{ notes_marvel_client_db }}
      MC_DB_Notresolvable={{ notes_marvel_client_db_notresolvable }}
      MC_DB_Unavailable={{ notes_marvel_client_db_unavailable }}
      MC_SupportIDVault={{ notes_marvel_client_support_idvault }}
      DISABLE_WORKSPACE_ROAMING={{ notes_disable_workspace_roaming }}
  loop:
    - "notes.ini"
    - "stubnotes.ini"

- name: "Creating shared data directory for Marvel Client"
  when:
    - notes_multiuser_enabled
    - notes_enable_marvel_client
  ansible.windows.win_file:
    path: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared"
    state: directory

- name: "Configuring shared notes.ini for Marvel Client"
  when:
    - notes_multiuser_enabled
    - notes_enable_marvel_client
  ansible.windows.win_copy:
    dest: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\notes.ini"
    content: |
      [Notes]
      KitType=1
      SharedDataDirectory={{ notes_multiuser_common_dir }}\HCL\Notes\Data\Shared
      InstallType={{ notes_install_type }}
      InstallMode=1
      FailoverSilent=1
      HidePromptFailoverInc=1
      OS_DisableMMapFileCopy=1
      Ports=TCPIP
      TCPIP=TCP,0,15,0,,12320,
      NotesProgram={{ notes_install_dir }}\
      Directory={{ notes_data_directory }}
      DISABLE_WORKSPACE_ROAMING={{ notes_disable_workspace_roaming }}
      DISABLE_CLIENTRECORD={{ notes_disable_clientrecord }}
      EnableNSLUnderCitrix={{ notes_enable_nsl_under_citrix }}
      EnableUsingAppDataForRoaming={{ notes_enable_using_appdata_for_roaming }}
      EXTMGR_ADDINS={{ marvel_client_dll }}
      MC_NetworkDirectory={{ notes_marvel_client_network_directory }}
      MC_AllowSyncDuringSetup={{ notes_marvel_client_allow_sync_during_setup }}
      MC_AllowSyncDuringSetup_FixPrompt={{ notes_marvel_client_allow_sync_during_setup_fixprompt }}
      MC_DB={{ notes_marvel_client_db }}
      MC_DB_Notresolvable={{ notes_marvel_client_db_notresolvable }}
      MC_DB_Unavailable={{ notes_marvel_client_db_unavailable }}
      MC_SupportIDVault={{ notes_marvel_client_support_idvault }}
      MC_WorkingDirectory={{ notes_marvel_client_working_directory }}
      MC_ZapNotes={{ notes_marvel_client_zap_notes }}
      MC_Msg_Suppress_0d4e={{ notes_marvel_client_msg_suppress_setup_complete }}

- name: "Implementing Justins Hacks, which are not proper"
  when:
    - notes_multiuser_enabled
    - notes_14_admin_hack_for_multiuser_single_client
  block:
    - name: "Downloading DomAdmin.ntf using Bearer token"
      register: domadmin_bearer
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/domadmin.ntf"
        dest: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\domadmin.ntf"
        headers:
          Authorization: "Bearer {{ installer_url_bearer }}"
        validate_certs: false
      when:
        - installer_url_bearer is defined
        - installer_url_bearer != ''
      failed_when: false

    - name: "Re-checking DomAdmin.ntf after the Bearer download"
      register: domadmin_post_bearer
      ansible.windows.win_stat:
        path: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\domadmin.ntf"

    - name: "Downloading DomAdmin.ntf using basic auth"
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/domadmin.ntf"
        dest: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\domadmin.ntf"
        url_username: "{{ installer_url_user }}"
        url_password: "{{ installer_url_pass }}"
        validate_certs: false
      when:
        - not domadmin_post_bearer.stat.exists

    - name: "Downloading events4.ntf using Bearer token"
      register: events4_bearer
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/events4.ntf"
        dest: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\events4.ntf"
        headers:
          Authorization: "Bearer {{ installer_url_bearer }}"
        validate_certs: false
      when:
        - installer_url_bearer is defined
        - installer_url_bearer != ''
      failed_when: false

    - name: "Re-checking events4.ntf after the Bearer download"
      register: events4_post_bearer
      ansible.windows.win_stat:
        path: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\events4.ntf"

    - name: "Downloading events4.ntf using basic auth"
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/events4.ntf"
        dest: "{{ notes_multiuser_common_dir }}\\HCL\\Notes\\Data\\Shared\\events4.ntf"
        url_username: "{{ installer_url_user }}"
        url_password: "{{ installer_url_pass }}"
        validate_certs: false
      when:
        - not events4_post_bearer.stat.exists

    - name: "Downloading Admin.exe using Bearer token"
      register: adminexe_bearer
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/admin.exe"
        dest: "{{ notes_install_dir }}\\admin.exe"
        headers:
          Authorization: "Bearer {{ installer_url_bearer }}"
        validate_certs: false
      when:
        - installer_url_bearer is defined
        - installer_url_bearer != ''
      failed_when: false

    - name: "Re-checking Admin.exe after the Bearer download"
      register: adminexe_post_bearer
      ansible.windows.win_stat:
        path: "{{ notes_install_dir }}\\admin.exe"

    - name: "Downloading Admin.exe using basic auth"
      ansible.windows.win_get_url:
        url: "{{ installer_base_url }}/{{ notes_14_admin_hack_for_multiuser_single_client_url_app_path }}/admin.exe"
        dest: "{{ notes_install_dir }}\\admin.exe"
        url_username: "{{ installer_url_user }}"
        url_password: "{{ installer_url_pass }}"
        validate_certs: false
      when:
        - not adminexe_post_bearer.stat.exists
